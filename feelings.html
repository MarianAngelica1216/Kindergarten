<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn Emotions</title>
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* Reset & Base */
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      font-family: 'Fredoka', sans-serif;
    }
    
    /* Container & Scene */
    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow-x: auto;
      overflow-y: hidden;
      cursor: grab;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .container::-webkit-scrollbar { display: none; }

    .scene {
      position: relative;
      height: 100%;
      width: max-content;
      transition: transform 0.5s ease-out;
      transform-origin: center center;
    }

    .background {
      display: block;
      width: auto;
      height: 100%;
      pointer-events: none;
      user-select: none;
      transition: filter 0.5s ease;
    }

    /* Clickable Items */
    .items-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 3;
    }
    .clickable-item {
      position: absolute;
      pointer-events: auto;
      cursor: pointer;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.5s ease-out;
    }
    .clickable-item:hover { transform: scale(1.05); }
    .inactive-item { opacity: 0.3; pointer-events: none; }
    .selected-img, .kid-img { width: 100px; height: auto; }

    /* Back & Exit Buttons */
    .back-button, .exit-button {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 50px;
      cursor: pointer;
      z-index: 600;
    }
    .exit-button { display: none; }

    /* Scroll Buttons */
    .scroll-button {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background-color: none;
      z-index: 10;
      
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      background: rgba(0,0,0,0.0);
      border-width: 0px;
    }
    .scroll-button img {
      width: 70px;
      height: 60px;
      pointer-events: none;
    }
    .scroll-left { left: 10px; }
    .scroll-right { right: 10px; }

    /* Bounce Animations */
    @keyframes bounceLeft {
      0%   { transform: translateY(-50%) translateX(0); }
      50%  { transform: translateY(-50%) translateX(-5px); }
      100% { transform: translateY(-50%) translateX(0); }
    }
    @keyframes bounceRight {
      0%   { transform: translateY(-50%) translateX(0); }
      50%  { transform: translateY(-50%) translateX(5px); }
      100% { transform: translateY(-50%) translateX(0); }
    }
    /* Apply bounce if not active */
    .scroll-left:not(.active) {
      animation: bounceLeft 2s infinite;
    }
    .scroll-right:not(.active) {
      animation: bounceRight 2s infinite;
    }

    /* Splash Screen */
    #splashScreen {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 24px;
      text-align: center;
      cursor: pointer;
      z-index: 500;
    }
    #splashScreen img {
      max-width: 80%;
      height: auto;
      margin-bottom: 20px;
    }

    /* Side Panel */
    .side-panel {
      position: fixed;
      bottom: -200px;
      left: 50%;
      transform: translateX(-50%);
      padding: 20px;
      display: flex;
      gap: 20px;
      background: #fff;
      border: 5px solid #1c1b23;
      border-radius: 35px;
      box-shadow: 0 -5px 10px rgba(0, 0, 0, 0.3);
      transition: bottom 0.5s ease-in-out;
      z-index: 500;
    }
    .face-button {
      width: 100px;
      transition: transform 0.3s ease-out;
    }
    .face-button:hover { transform: scale(1.3); }

    /* Victory Overlay: Transparent background to allow interaction underneath */
    #victoryOverlay {
      position: fixed;
      inset: 0;
      background: transparent;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 400; /* above the kids (z-index:2-3) but below utility buttons (z-index:600) */
      pointer-events: none;
    }
    #victoryOverlay img {
      max-width: 80%;
      max-height: 50%;
      height: auto;
      pointer-events: none;
      z-index: 400;
    }
    
    /* Restart Button: bright orange, Fredoka Bold, bottom center */
    #restartBtn {
      pointer-events: auto; /* Allow clicking even though parent ignores pointer events */
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px;
      font-size: 50px;
      font-family: 'Fredoka', sans-serif;
      font-weight: bold;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      border: maroon solid 5px;
      background: #FFA500;
      color: #fff;
      z-index: 450; /* above confetti, below utility buttons */
    }
  </style>
</head>
<body>
  <!-- Back & Exit Buttons -->
  <a href="homepage.html" id="backButton">
    <img src="images/back.png" alt="Back" class="back-button" />
  </a>
  
  <img src="images/utils/exit.png" alt="Exit" class="exit-button" id="exitButton">

  <!-- Left Arrow Button -->
  <button id="scrollLeft" class="scroll-button scroll-left">
    <img src="images/utils/arrow-left.png" alt="Left">
  </button>

  <!-- Right Arrow Button -->
  <button id="scrollRight" class="scroll-button scroll-right">
    <img src="images/utils/arrow-right.png" alt="Right">
  </button>

  <!-- Main Container -->
  <div class="container" id="container">
    <div class="scene" id="scene">
      <img src="images/feelings/bg-playground.png" alt="Background" class="background" id="background">

      <!-- Splash Screen -->
      <div id="splashScreen">
        <img src="videos/feelings.gif" alt="Farm Animation" style="max-width: 500px;">
        <div>Click anywhere to start</div>
      </div>

      <!-- Clickable Items -->
      <div class="items-layer">
        <!-- Scared -->
        <div class="clickable-item" style="bottom:200px; left:445px;" data-id="kid-scared">
          <img src="images/feelings/selected-null.png" alt="Selected" class="selected-img">
          <img src="images/feelings/kid-scared.png" alt="Scared Kid" class="kid-img" style="width:300px;">
        </div>
        <!-- Sad -->
        <div class="clickable-item" style="bottom:220px; right:740px;" data-id="kid-sad">
          <img src="images/feelings/selected-null.png" alt="Selected" class="selected-img">
          <img src="images/feelings/kid-sad.png" alt="Sad Kid" class="kid-img" style="width:150px;">
        </div>
        <!-- Surprised -->
        <div class="clickable-item" style="bottom:230px; left:950px;" data-id="kid-surprised">
          <img src="images/feelings/selected-null.png" alt="Selected" class="selected-img">
          <img src="images/feelings/kid-surprised.png" alt="Surprised Kid" class="kid-img" style="width:220px;">
        </div>
        <!-- Angry -->
        <div class="clickable-item" style="bottom:240px; right:1100px;" data-id="kid-angry">
          <img src="images/feelings/selected-null.png" alt="Selected" class="selected-img">
          <img src="images/feelings/kid-angry.png" alt="Angry Kid" class="kid-img" style="width:220px;">
        </div>
        <!-- Happy -->
        <div class="clickable-item" style="bottom:200px; left:1400px;" data-id="kid-happy">
          <img src="images/feelings/selected-null.png" alt="Selected" class="selected-img">
          <img src="images/feelings/kid-happy.png" alt="Happy Kid" class="kid-img" style="width:350px;">
        </div>
      </div>
    </div>
  </div>

  <!-- Side Panel Controls -->
  <div class="side-panel" id="side-panel">
    <img src="images/feelings/face-happy.png" alt="Happy Face" class="face-button" onclick="changeFeeling('selected-happy.png'); playSound('sounds/happy.mp3');">
    <img src="images/feelings/face-sad.png" alt="Sad Face" class="face-button" onclick="changeFeeling('selected-sad.png'); playSound('sounds/sad.mp3');">
    <img src="images/feelings/face-angry.png" alt="Angry Face" class="face-button" onclick="changeFeeling('selected-angry.png'); playSound('sounds/angry.mp3');">
    <img src="images/feelings/face-surprised.png" alt="Surprised Face" class="face-button" onclick="changeFeeling('selected-surprised.png'); playSound('sounds/surprised.mp3');">
    <img src="images/feelings/face-scared.png" alt="Scared Face" class="face-button" onclick="changeFeeling('selected-scared.png'); playSound('sounds/scared.mp3');">
  </div>

  <!-- Victory Overlay (Transparent with confetti and restart button) -->
  <div id="victoryOverlay">
    <button id="restartBtn">Restart?</button>
    <img src="images/utils/confetti.gif" alt="Confetti" style = "width:100%;">
  </div>

  <!-- Background Music -->
  <audio id="bgMusic" loop>
    <source src="sounds/bg-music1.mp3" type="audio/mpeg">
  </audio>

  <script>
    // DOM Elements
    const container = document.getElementById('container');
    const scene = document.getElementById('scene');
    const background = document.getElementById('background');
    const sidePanel = document.getElementById('side-panel');
    const splashScreen = document.getElementById('splashScreen');
    const bgMusic = document.getElementById('bgMusic');
    const scrollLeftBtn = document.getElementById('scrollLeft');
    const scrollRightBtn = document.getElementById('scrollRight');
    const backButton = document.getElementById('backButton');
    const exitButton = document.getElementById('exitButton');
    const victoryOverlay = document.getElementById('victoryOverlay');
    const restartBtn = document.getElementById('restartBtn');

    let isZoomed = false;
    let activeItem = null;
    let isDragging = false;
    let startX = 0;
    let scrollLeft = 0;
    let scrollInterval = null;

    // Splash Screen & Music
    splashScreen.addEventListener('click', () => {
      splashScreen.style.display = 'none';
      bgMusic.play().then(fadeInMusic).catch(() => console.log('Interaction required'));
    });
    function fadeInMusic() {
      let volume = 0; 
      const target = 0.3;
      const iv = setInterval(() => {
        volume = Math.min(volume + 0.02, target);
        bgMusic.volume = volume;
        if (volume >= target) clearInterval(iv);
      }, 100);
    }
    document.body.addEventListener('click', function playOnInteraction() {
      if (bgMusic.paused) bgMusic.play().then(fadeInMusic);
      document.body.removeEventListener('click', playOnInteraction);
    });

    // Drag-to-Scroll
    container.addEventListener('mousedown', e => {
      if (isZoomed) return;
      isDragging = true;
      startX = e.pageX;
      scrollLeft = container.scrollLeft;
      container.style.cursor = 'grabbing';
    });
    container.addEventListener('mousemove', e => {
      if (!isDragging) return;
      e.preventDefault();
      const walk = (e.pageX - startX) * 2;
      container.scrollLeft = scrollLeft - walk;
    });
    ['mouseup','mouseleave'].forEach(evt => {
      container.addEventListener(evt, () => {
        isDragging = false;
        container.style.cursor = 'grab';
      });
    });

    // Scroll Buttons
    function startScroll(direction, btn) {
      btn.classList.add('active');
      stopScroll();
      scrollInterval = setInterval(() => {
        container.scrollLeft += direction * 10;
      }, 20);
    }
    function stopScroll() { 
      clearInterval(scrollInterval);
      scrollLeftBtn.classList.remove('active');
      scrollRightBtn.classList.remove('active');
    }
    scrollLeftBtn.addEventListener('mousedown', () => startScroll(-1, scrollLeftBtn));
    scrollRightBtn.addEventListener('mousedown', () => startScroll(1, scrollRightBtn));
    document.addEventListener('mouseup', stopScroll);

    // Zoom & Items
    const items = document.querySelectorAll('.clickable-item');
    items.forEach(item => {
      item.addEventListener('click', e => {
        if (isDragging || isZoomed) return;
        e.stopPropagation();
        zoomOnItem(item);
      });
    });
    function zoomOnItem(item) {
      activeItem = item;
      // Deactivate other items
      items.forEach(i => { if (i !== item) i.classList.add('inactive-item'); });

      const rect = item.querySelector('.kid-img').getBoundingClientRect();
      const contRect = container.getBoundingClientRect();
      const centerX = rect.left + rect.width/2 - contRect.left + container.scrollLeft;
      const centerY = rect.top + rect.height/2 - contRect.top;

      scene.style.transformOrigin = `${centerX}px ${centerY}px`;
      scene.style.transform = 'scale(1.5)';
      background.style.filter = 'brightness(0.5)';
      container.scrollTo({ left: centerX - container.clientWidth/2, behavior: 'smooth' });

      sidePanel.style.bottom = '20px';
      container.style.overflowX = 'hidden';
      isZoomed = true;

      // Swap buttons & hide scroll
      backButton.style.display = 'none';
      exitButton.style.display = 'block';
      scrollLeftBtn.style.display = 'none';
      scrollRightBtn.style.display = 'none';
    }
    exitButton.addEventListener('click', exitZoom);
    function exitZoom() {
      // Reactivate items
      items.forEach(i => {
        i.classList.remove('inactive-item');
        i.style.pointerEvents = ''; // re-enable clicking
      });

      scene.style.transform = 'scale(1)';
      background.style.filter = '';
      sidePanel.style.bottom = '-200px';
      container.style.overflowX = 'auto';
      isZoomed = false;
      activeItem = null;

      // Restore buttons & scroll
      exitButton.style.display = 'none';
      backButton.style.display = 'block';
      scrollLeftBtn.style.display = 'block';
      scrollRightBtn.style.display = 'block';
    }
    document.addEventListener('click', e => {
      if (!isZoomed) return;
      if (e.target.closest('.clickable-item') || e.target.closest('.side-panel') || e.target === exitButton) return;
      exitZoom();
    });

    // Check Answers & Victory
    function checkAnswers() {
      const allCorrect = Array.from(items).every(item => {
        const id = item.dataset.id;
        const expected = `selected-${id.split('kid-')[1]}.png`;
        return item.querySelector('.selected-img').src.endsWith(expected);
      });
      if (allCorrect) {
        if (isZoomed) exitZoom();
        container.scrollTo({ left: (scene.scrollWidth - container.clientWidth) / 2, behavior: 'smooth' });
        new Audio('sounds/victory.mp3').play();
        
        // Disable clicking on kids so they are just for viewing
        items.forEach(item => {
          item.style.pointerEvents = 'none';
        });

        // Show victory overlay (transparent confetti & restart button)
        victoryOverlay.style.display = 'flex';
      }
    }

    // Change Feeling & Sound
    function changeFeeling(file) {
      if (activeItem) {
        activeItem.querySelector('.selected-img').src = `images/feelings/${file}`;
        checkAnswers();
      }
    }
    function playSound(src) { new Audio(src).play(); }

    // Restart
    restartBtn.addEventListener('click', () => location.reload());

    // Setup & Center on Load
    window.addEventListener('load', () => {
      if (background.complete) adjustScene(); else background.onload = adjustScene;
      centerOnLoad();
    });
    function adjustScene() {
      const { naturalWidth: w, naturalHeight: h } = background;
      const scaledW = (w/h) * container.clientHeight;
      scene.style.width = `${scaledW}px`;
      document.querySelector('.items-layer').style.width = `${scaledW}px`;
    }
    function centerOnLoad() {
      container.scrollLeft = (scene.scrollWidth - container.clientWidth)/2;
    }
  </script>
</body>
</html>
