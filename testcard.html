<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pricing Plans</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #fafafa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .pricing-container {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 40px 20px;
      max-width: 1200px;
    }

    .card {
      background: #fff;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      border-radius: 16px;
      padding: 32px 24px;
      width: 280px;
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 2px solid transparent;
      position: relative;
    }

    .card:hover {
      transform: translateY(-10px);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
      border-color: #00d26a;
    }

    .badge {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #00d26a;
      color: white;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: bold;
    }

    .plan-title {
      font-size: 24px;
      font-weight: 600;
      margin-top: 12px;
      color: #333;
    }

    .features {
      font-size: 15px;
      color: #555;
      margin: 16px 0;
      line-height: 1.6;
    }

    .price {
      font-size: 34px;
      font-weight: bold;
      color: #000;
      margin-top: 12px;
    }

    .old-price {
      font-size: 14px;
      text-decoration: line-through;
      color: #999;
    }

    .highlight {
      font-size: 14px;
      color: #00d26a;
      font-weight: bold;
      margin-top: 4px;
    }

    .btn {
      padding: 12px;
      background-color: #00d26a;
      color: #fff;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      margin-top: auto;
    }

    .btn:hover {
      background-color: #00b25d;
    }

    @media (max-width: 768px) {
      .card {
        width: 100%;
        max-width: 360px;
      }
    }
  </style>
</head>
<body>

<div class="pricing-container">

  <div class="card">
    <div class="price">₱0</div>
    <div class="plan-title">Free Plan</div>
    <div class="features">Access to limited free games. Great for trying out before committing!</div>
    <button class="btn" style = "background-color:#F1f1f1;color: gray;border:lightgray solid;">Play Now</button>
  </div>

  <div class="card">
    <div class="price">₱150</div>
    <div class="plan-title">Monthly Plan</div>
    <div class="features">Unlimited access to all games for 1 month.</div>
    <button class="btn">Buy Now</button>
  </div>

  <div class="card" style="border-color: #00d26a;">
    <div class="badge">Most Popular</div>
    <div class="price">₱1599</div>
    <div class="old-price">₱1800</div>
    <div class="highlight">Save 11%</div>
    <div class="plan-title">Annual Plan</div>
    <div class="features">Unlimited access to <strong>all games</strong> for 1 year. </div>
    <button class="btn">Buy Now</button>
  </div>

</div>

</body>
</html>
