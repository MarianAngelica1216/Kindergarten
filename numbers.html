<!DOCTYPE html>
<html>
  <head>
    <title>Counting Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Poppins:wght@100..900&display=swap" rel="stylesheet">
    <style>
      body {
        background-image: url("images/numbers/bg-numbers.png");
        background-size: cover;
        background-repeat: no-repeat;
        background-attachment: fixed;
        position: relative;
        height: 100vh;
        overflow-y: hidden;
        margin: 0;
        overflow-x: hidden; 
        font-family: fredoka;
      }

      /* Splash & Victory Screens */
      #splashScreen, #victoryScreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 24px;
        text-align: center;
        cursor: pointer;
        font-weight: normal;
      }
      /* Victory screen now includes confetti and a restart button */
      #victoryScreen {
        display: none;
      }
      #victoryScreen .confetti {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: url("images/utils/confetti.gif") no-repeat center top;
        background-size: cover;
        z-index: 50;
      }
      #victoryScreen .content {
        position: relative;
        z-index: 100;
      }
      #victoryScreen img {
        max-width: 80%;
        height: auto;
        margin-bottom: 20px;
      }
      #victoryScreen button {
        font-size: 24px;
        padding: 10px 20px;
        cursor: pointer;
      }

      .black {
        width: 100%;
        height: 100%;
        z-index: 1;
        background-color: rgba(255, 255, 255, 0.2); 
        backdrop-filter: blur(2px); 
        -webkit-backdrop-filter: blur(2px); 
      }

      .clip-board {
        position: absolute;
        left: 320px;
        top: 130px;
        max-width: 660px;
        z-index: 2;
      }

      .clipboard {
        position: absolute;
        left: 500px;
        top: 130px;
        max-width: 500px;
        z-index: 5;
        transform: translateY(100vh); /* Start offscreen at the bottom */
      }

      .back-button {
        position: absolute;
        top: 20px;
        width: 90px;
        height: auto;
        cursor: pointer;
        z-index: 150;
      }

      
      .back-button { left: 20px; }
      .settings-button { right: 20px; }
      
      /* Items container at the top */
      .items-container {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        z-index: 50;
      }

      /* Container for the number boxes */
      .number-boxes {
        transform: translateX(-300%);
        top: 120px;
        position: relative;
        width: 170px;
        height: 150px;
        display: grid;
        grid-template-columns: repeat(2, 200px);
        grid-template-rows: repeat(2, 190px);
        gap: 20px;
        opacity: 0;
        transition: opacity 0.8s ease;
      }
 
      .number-box {
        width: 200px;
        height: 190px;
        background-color: white;
        border: 5px solid;
        border-radius: 30px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 130px;
        font-weight: bold;
        color: black;
        transition: background-color 0.3s ease;
        cursor: pointer;
        transition: transform 0.5s ease-out; 
      }

      .number-box:hover {
        transform: scale(1.1);
      }

      /* Shake Animation */
      @keyframes shake {
        0% { transform: translate(0,0); }
        20% { transform: translate(-5px,0); }
        40% { transform: translate(5px,0); }
        60% { transform: translate(-5px,0); }
        80% { transform: translate(5px,0); }
        100% { transform: translate(0,0); }
      }
      .shake { animation: shake 0.5s; }

      /* Items Picture Container for Apples */
      .items-picture-container {
        position: absolute; 
        top: 50%; 
        left: 50%; 
        transform: translate(-32%, -50%);
        width: 410px; 
        height: 320px;
        z-index: 25; 
        padding: 20px;
      }

      .items-picture-container img {
        max-width: 80px;
        position: absolute;
        opacity: 0;
        transition: opacity 1s ease;
      }

      /* Customer container */
      .container-behind-counter {
        position: absolute;
        right: 120px;        
        top: 150px;        
        z-index: 1;
      }

      .customer {
        max-width: 250px;
        transform: translateX(100vw); /* start offscreen */
        transition: transform 1s ease-out;
      }

      /* Food stall/frame */
      .frame {
        position: absolute;
        top: -100px;
        left: 50%;
        transform: translateX(-50%);
        width: 117%;
        z-index: 2; 
        overflow: hidden;
      }

      /* Speech bubble styling */
      .speech-bubble {
        position: absolute;
        max-width: 90%;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: white;
        padding: 20px;
        border-radius: 50px;
        box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
        font-size: 35px;
        font-weight: bold;
        z-index: 50;
        text-align: center;
        opacity: 1;
        transition: opacity 0.8s ease;
        white-space: nowrap;
      }

      .speech-bubble::after {
        content: "";
        position: absolute;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
        border-width: 10px;
        border-style: solid;
        border-color: white transparent transparent transparent;
      }

      /* Settings Modal */
.settings-button {
  position: absolute;
  top: 20px;
  right: 40px;
  width: 50px;
  cursor: pointer;
  z-index: 150;
}

.settings-modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
  z-index: 300;
  font-family: "Fredoka", sans-serif;
}

.settings-content {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: #fff;
  padding: 20px;
  border-radius: 10px;
  text-align: left;
  font-weight: normal;
  width: 400px;
}

.settings-content h2 {
  margin-top: 0;
  text-align: center;
  font-size: 24px;
}

.settings-content label {
  display: block;
  margin: 10px 0;
  font-size: 20px;
}

.settings-content input[type="number"],
.settings-content input[type="range"],
.settings-content input[type="checkbox"] {
  margin: 10px;
}

.settings-content button {
  display: block;
  margin: 15px auto 0;
  padding: 10px 20px;
  font-size: 16px;
  cursor: pointer;
  background-color: skyblue;
  border: none;
  border-radius: 5px;
  color: #333;
  font-family: "Fredoka", sans-serif;
  font-weight: bold;
}

.settings-content button:hover {
  background-color: orange;
}
      
      .purple { border-color: blueviolet; color: blueviolet; }
      .pink { border-color: hotpink; color: hotpink; }
      .blue { border-color: blue; color: navy; }
      .orange { border-color: rgb(255, 145, 0); color: rgb(255, 145, 0); }
    </style>
  </head>
  <body>
    <a href="javascript:history.back()" id="backButton">
      <img src="images/back.png" alt="Back" class="back-button" />
    </a>
    <img src="images/utils/settings.png" id="settingsButton" class="settings-button" alt="Settings">

    <!-- Splash Screen -->
    <div id="splashScreen">
      <img src="videos/numbers.gif" alt="Farm Animation" style="width: 400px;" />
      <div>Click anywhere to start</div>
    </div>
    
    <!-- Victory Screen with Confetti and Restart -->
    <div id="victoryScreen">
      <div class="confetti"></div>
      <div class="content">
        <img src="images/victory.png" alt="Victory">
        <button id="restartButton">Restart</button>
      </div>
    </div>

    <!-- Items Container (At the Top) for Number Boxes -->
    <div class="items-container">
      <div class="number-boxes" id="numberBoxes">
        <div class="number-box purple"></div>
        <div class="number-box orange"></div>
        <div class="number-box blue"></div>
        <div class="number-box pink"></div>
      </div>
    </div>

    <!-- Items Picture Container (for Apples) -->
    <div class="items-picture-container" id="itemsContainer">
      <!-- Items will be added here -->
    </div>

    <!-- Speech Bubble -->
    <div class="speech-bubble" id="speechBubble"></div>

    <!-- Customer (Behind the Stall) -->
    <div class="container-behind-counter">
      <img src="images/numbers/customers/1.png" class="customer" id="customer">
    </div>
    <img src="images/numbers/clipboardd.png" class="clipboard" id="clipboard">
    <!-- Food Stall -->
    <img src="images/numbers/food-stall.png" class="frame">
    
    <!-- Settings Modal -->
    <div class="settings-modal" id="settingsModal">
      <div class="settings-content">
        <h2>Settings</h2>
        <label>
          Number of Questions: 
          <input type="number" id="questionsInput" min="1" value="5">
        </label>
        <label>
          <input type="checkbox" id="endlessCheckbox"> Endless Mode
        </label>
        <label>
          Music Volume:
          <input type="range" id="musicVolume" min="0" max="1" step="0.01" value="0.5">
        </label>
        <label>
          Sound Effects Volume:
          <input type="range" id="sfxVolume" min="0" max="1" step="0.01" value="1">
        </label>
        <button id="saveSettings">Save</button>
      </div>
    </div>
    
    <div class="black"></div>
    <audio id="bgMusic" loop>
      <source src="sounds/bg-music1.mp3" type="audio/mpeg">
    </audio>
    
    <script>
      // Global settings
let endlessMode = false;
let totalQuestions = 5;
let currentQuestion = 0;
let currentFruit = "apples";
let musicVolume = 0.5;
let sfxVolume = 1;
let answerRevealed = false;

// Timing constants
const typingDelay = 30;
const afterTypingPause = 500;
const customerSlideDuration = 1000;
const fadeDuration = 1000;
const delayBeforeTyping = 500;
const delayBeforeFruit = 400;
const delayBeforeNumbers = 600;
const delayBeforeNextCustomer = 1500;
const clipboardSlideDuration = 500;

const speechTemplates = [
  "I think I want some _.",
  "How much _ should I buy?",
  "Can I have some _ please?",
  "I love _. Can I get some?",
  "Those _ look tasty! Can I have some?",
  "I feel like eating _.",
  "Could I buy some _?",
  "I want to try some _. How many should I get?",
  "Do you have any _? I'd love some!",
  "Those _ look so fresh! Can I get some?",
  "I'm hungry for _. Can I have a few?",
  "I think _ would be perfect for today!"
];

const fruits = ["apples", "oranges", "grapes", "strawberries", "mangos"];
const thankYouMessages = [
  "Thank you!",
  "This will keep me full!",
  "This looks fresh!",
  "Delicious!",
  "Yum!",
  "Thanks! I love _!",
  "I appreciate it!",
  "Perfect! These look amazing!",
  "Wow, these _ look so good!",
  "These _ are just what I needed."
];

function getRandom(array) {
  return array[Math.floor(Math.random() * array.length)];
}

function getRandomSpeechAndFruit() {
  const template = getRandom(speechTemplates);
  const fruit = getRandom(fruits);
  return { text: template.replace("_", fruit), fruit: fruit };
}

function getRandomThankYou(fruit) {
  const thankyou = getRandom(thankYouMessages);
  return thankyou.replace("_", fruit);
}

function typeText(element, text, callback) {
  element.textContent = "";
  let index = 0;
  const interval = setInterval(() => {
    element.textContent += text[index];
    index++;
    if (index === text.length) {
      clearInterval(interval);
      if (callback) setTimeout(callback, afterTypingPause);
    }
  }, typingDelay);
}

function slideUpClipboard() {
  const clipboard = document.getElementById('clipboard');
  clipboard.style.transition = `transform ${clipboardSlideDuration}ms ease-out`;
  clipboard.style.transform = "translateY(0)";
}

function startGame() {
  currentQuestion = 0;
  answerRevealed = false;
  resetUI();
  nextCustomer();
}

function resetUI() {
  const speechBubble = document.getElementById('speechBubble');
  const boxesContainer = document.getElementById('numberBoxes');
  const boxes = document.querySelectorAll('.number-box');
  const itemsContainer = document.getElementById('itemsContainer');
  const customerImg = document.getElementById('customer');
  const clipboardImg = document.getElementById('clipboard');
  
  boxes.forEach(box => {
    box.style.backgroundColor = "white";
    box.style.borderColor = "";
    box.style.color = ""; // Reset text color
    box.style.pointerEvents = "auto";
    box.textContent = "";
    delete box.dataset.correct;
    box.classList.remove('shake');
  });

  boxesContainer.style.opacity = 0;
  itemsContainer.innerHTML = '';
  speechBubble.style.opacity = 0;
  speechBubble.textContent = "";
  customerImg.style.transition = `transform ${customerSlideDuration}ms ease-out`;
  customerImg.style.transform = "translateX(100vw)";
  clipboardImg.style.transition = `none`;
  clipboardImg.style.transform = "translateY(100vh)";
  answerRevealed = false;
}

function nextCustomer() {
  // Reset answer revealed state at the beginning of each question
  answerRevealed = false;
  
  const speechBubble = document.getElementById('speechBubble');
  const boxesContainer = document.getElementById('numberBoxes');
  const boxes = document.querySelectorAll('.number-box');
  const itemsContainer = document.getElementById('itemsContainer');
  const customerImg = document.getElementById('customer');
  
  speechBubble.style.opacity = 0;
  speechBubble.textContent = "";
  boxesContainer.style.opacity = 0;
  itemsContainer.innerHTML = '';
  
  // Completely reset each box to its original state
  boxes.forEach((box, index) => {
    // First, restore the original class-based colors
    const originalClasses = ['purple', 'orange', 'blue', 'pink'];
    box.className = 'number-box ' + originalClasses[index];
    
    // Then reset all inline styles to ensure they don't override the class styles
    box.style.backgroundColor = "white";
    box.style.borderColor = "";
    box.style.color = "";
    box.style.pointerEvents = "auto";
    box.textContent = "";
    delete box.dataset.correct;
    box.classList.remove('shake');
    // Clear any previous click handlers
    box.onclick = null;
  });
  
  const randomCustomer = Math.floor(Math.random() * 8) + 1;
  customerImg.src = "images/numbers/customers/" + randomCustomer + ".png";
  
  setTimeout(() => {
    customerImg.style.transform = "translateX(0)";
    setTimeout(() => {
      const { text, fruit } = getRandomSpeechAndFruit();
      currentFruit = fruit;
      speechBubble.style.opacity = 1;
      typeText(speechBubble, text, () => {
        slideUpClipboard();
        const itemCount = fadeInItems(currentFruit);
        setTimeout(() => {
          setupNumberBoxes(itemCount);
          document.getElementById('numberBoxes').style.opacity = 1;
        }, delayBeforeNumbers);
      });
    }, delayBeforeTyping);
  }, 100);
}

function fadeInItems(fruit) {
  const container = document.getElementById('itemsContainer');
  const count = Math.floor(Math.random() * 10) + 1;
  const itemSize = 80, gap = 20, maxCols = 4;
  const cols = Math.min(count, maxCols);
  const rows = Math.ceil(count / maxCols);
  const groupWidth = (cols * itemSize) + ((cols - 1) * gap);
  const groupHeight = (rows * itemSize) + ((rows - 1) * gap);
  const containerWidth = container.clientWidth;
  const containerHeight = container.clientHeight;
  const startX = (containerWidth - groupWidth) / 2;
  const startY = (containerHeight - groupHeight) / 2;

  for (let i = 0; i < count; i++) {
    const col = i % maxCols;
    const row = Math.floor(i / maxCols);
    const itemImg = document.createElement('img');
    itemImg.src = "images/" + fruit + ".png";
    itemImg.classList.add("fruit");
    itemImg.style.left = `${startX + col * (itemSize + gap)}px`;
    itemImg.style.top = `${startY + row * (itemSize + gap)}px`;
    itemImg.style.opacity = 0;
    container.appendChild(itemImg);
    setTimeout(() => {
      itemImg.style.transition = `opacity ${fadeDuration}ms`;
      itemImg.style.opacity = 1;
    }, delayBeforeFruit);
  }
  return count;
}

function setupNumberBoxes(correctCount) {
  const boxes = document.querySelectorAll('.number-box');
  let uniqueNumbers = new Set();
  uniqueNumbers.add(correctCount);
  while (uniqueNumbers.size < boxes.length) {
    let num = Math.floor(Math.random() * 10) + 1;
    uniqueNumbers.add(num);
  }
  uniqueNumbers = Array.from(uniqueNumbers).sort(() => Math.random() - 0.5);
  
  boxes.forEach((box, index) => {
    const num = uniqueNumbers[index];
    box.textContent = num;
    if (num === correctCount) {
      box.dataset.correct = "true";
    } else {
      box.dataset.correct = "false";
    }
    // Enable clicking for manual answer selection
    box.onclick = onBoxClick;
  });
}

function onBoxClick() {
  if (answerRevealed) return; // Ignore if already answered
  
  const isCorrect = this.dataset.correct === "true";
  
  if (!isCorrect) {
    this.style.backgroundColor = "red";
    this.style.color = "white";
    this.classList.add('shake');
    setTimeout(() => this.classList.remove('shake'), 500);
    let wrongAudio = new Audio('sounds/wrong.mp3');
    wrongAudio.volume = sfxVolume;
    wrongAudio.play();
    
    // Only disable this box, keep others clickable
    this.style.pointerEvents = "none";
    return;
  }
  
  // If correct answer
  answerRevealed = true;
  
  // Disable all boxes
  const boxes = document.querySelectorAll('.number-box');
  boxes.forEach(box => {
    box.style.pointerEvents = "none";
  });
  
  let correctAudio = new Audio('sounds/correct.mp3');
  correctAudio.volume = sfxVolume;
  correctAudio.play();
  this.style.backgroundColor = "lightgreen";
  this.style.borderColor = "darkgreen";
  this.style.color = "darkgreen";
  
  const speechBubble = document.getElementById('speechBubble');
  const message = getRandomThankYou(currentFruit);
  typeText(speechBubble, message, () => {
    fadeOutElements(() => {
      const customerImg = document.getElementById('customer');
      customerImg.style.transform = "translateX(100vw)";
      if (!endlessMode && currentQuestion >= totalQuestions - 1) {  // Account for 0-indexing
        const bgMusic = document.getElementById('bgMusic');
        bgMusic.pause();
        let endAudio = new Audio('sounds/end-music.mp3');
        endAudio.volume = musicVolume;
        endAudio.play();
        setTimeout(() => {
          document.getElementById('victoryScreen').style.display = 'flex';
        }, delayBeforeNextCustomer);
      } else {
        currentQuestion++;
        setTimeout(nextCustomer, delayBeforeNextCustomer);
      }
    });
  });
}

function fadeOutElements(callback) {
  const speechBubble = document.getElementById('speechBubble');
  const boxesContainer = document.getElementById('numberBoxes');
  speechBubble.style.opacity = 0;
  boxesContainer.style.opacity = 0;
  document.querySelectorAll('#itemsContainer img.fruit').forEach(img => {
    img.style.transition = `opacity ${fadeDuration}ms`;
    img.style.opacity = 0;
  });
  const clipboard = document.getElementById('clipboard');
  clipboard.style.transition = `transform ${clipboardSlideDuration}ms ease-in`;
  clipboard.style.transform = "translateY(100vh)";
  setTimeout(callback, fadeDuration);
}

// Settings Modal and Restart functionality
document.addEventListener("DOMContentLoaded", function () {
  const splashScreen = document.getElementById('splashScreen');
  const victoryScreen = document.getElementById('victoryScreen');
  const bgMusic = document.getElementById('bgMusic');
  const settingsButton = document.getElementById('settingsButton');
  const settingsModal = document.getElementById('settingsModal');
  const saveSettings = document.getElementById('saveSettings');
  const questionsInput = document.getElementById('questionsInput');
  const endlessCheckbox = document.getElementById('endlessCheckbox');
  const musicVolumeInput = document.getElementById('musicVolume');
  const sfxVolumeInput = document.getElementById('sfxVolume');
  const restartButton = document.getElementById('restartButton');

  // Splash start
  splashScreen.addEventListener("click", function() {
    splashScreen.style.display = "none";
    bgMusic.volume = musicVolume;
    bgMusic.play();
    startGame();
  });
  
  // Victory restart via restart button
  restartButton.addEventListener("click", function() {
    victoryScreen.style.display = "none";
    bgMusic.currentTime = 0;
    bgMusic.volume = musicVolume;
    bgMusic.play();
    startGame();
  });
  
  // Open settings modal
  settingsButton.addEventListener("click", () => {
    questionsInput.value = totalQuestions;
    endlessCheckbox.checked = endlessMode;
    questionsInput.disabled = endlessCheckbox.checked;
    musicVolumeInput.value = musicVolume;
    sfxVolumeInput.value = sfxVolume;
    settingsModal.style.display = "flex";
  });
  
  endlessCheckbox.addEventListener("change", () => {
    questionsInput.disabled = endlessCheckbox.checked;
  });
  
  saveSettings.addEventListener("click", () => {
    totalQuestions = parseInt(questionsInput.value) || 5;
    endlessMode = endlessCheckbox.checked;
    musicVolume = parseFloat(musicVolumeInput.value);
    sfxVolume = parseFloat(sfxVolumeInput.value);
    bgMusic.volume = musicVolume;
    settingsModal.style.display = "none";
  });
});
    </script>
  </body>
</html>
